name: Generate Pac-Man Contribution Graph

on:
  schedule:
    # runs every day at 00:00 UTC — edit as you like
    - cron: "0 0 * * *"
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate pacman contribution graph
        uses: IsaacSaikali/github-pacman-contribution-graph@v1
        with:
          github_user_name: yupAyush
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark

      - name: Push graph to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
